<head>
<meta charset="utf-8"/>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Architects+Daughter&family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<script>
  if (window.pdfjsLib) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
  }
</script>

<script>
  // Tweaks defaults
  const TWEAKS = /*EDITMODE-BEGIN*/{
    "view": "mobile",
    "accent": "mint",
    "density": "default",
    "showLabels": true,
    "docBg": "paper"
  }/*EDITMODE-END*/;
  window.TWEAKS = TWEAKS;

  (function(){
    // ── 裝置偵測 & 模式判斷 & 主題初始化 ────────────────────────────────
    const url = new URL(location.href);
    const forced = url.searchParams.get('view'); // 'mobile' | 'desktop' | 'both'
    const previewParam = url.searchParams.has('preview');
    let inIframe = false;
    try { inIframe = (window.self !== window.top); } catch(e){ inIframe = true; }

    // 主題初始化
    const savedTheme = localStorage.getItem('theme');
    const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    const theme = savedTheme || systemTheme;
    document.documentElement.dataset.theme = theme;

    // PWA Service Worker 註冊
    // SM_NATIVE 代表前端是 APK 內建檔案，本來就在本機，
    // 再包一層 Service Worker 快取只會多一份可能過期的副本。
    if (!window.SM_NATIVE && 'serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=3.6.0').catch(err => {
          console.error('ServiceWorker 註冊失敗: ', err);
        });
      });
    }

    // 只有明確要求 preview（URL 參數）或 Claude Design 編輯器（iframe）才進原型模式
    const isPreview = previewParam || (inIframe && forced === 'both');

    // Live 模式裝置判斷（UA + 視窗寬度；forced 會覆寫）
    function detectDevice(){
      if (forced === 'mobile' || forced === 'desktop') return forced;
      const ua = navigator.userAgent || '';
      const mobileUA = /android|iphone|ipad|ipod|mobile|tablet|blackberry|iemobile|opera mini/i.test(ua);
      const narrow = window.matchMedia('(max-width: 980px)').matches;
      return (mobileUA || narrow) ? 'mobile' : 'desktop';
    }

    window.APP_MODE = {
      isPreview: isPreview,
      device: detectDevice(),
      forced: forced,
    };
    document.documentElement.dataset.mode = isPreview ? 'preview' : 'live';
    document.body && (document.body.dataset.mode = isPreview ? 'preview' : 'live');
  })();
</script>
</head>
<body>
<div id="root"></div>

<script src="js/config.js?v=3.6.0"></script>
<script src="js/native.js?v=3.6.0"></script>

<script src="js/store.js?v=3.6.0"></script>

<script type="text/babel" src="js/mobile.jsx?v=3.6.0"></script>
<script type="text/babel" src="js/desktop.jsx?v=3.6.0"></script>
<script type="text/babel" src="js/boot.jsx?v=3.6.0"></script>

</body>
</html>
