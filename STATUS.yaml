recent_changes: "v3.13.0 — signatures and stamps: sign once with a finger, then drop it onto images or PDF pages on-device. Hand-drawn signatures are stored as strokes, not pixels, so stamping a PDF emits vector paths (a few KB, sharp at any zoom); imported photos of signatures or red chops get their white background keyed out and stamp via an image XObject with an SMask. Placement compensates for /Rotate — the viewer rotates the page but the content stream does not — verified by rendering the stamped page and counting ink per quadrant; 45 signature tests"

