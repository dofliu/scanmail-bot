key_metrics: "91 API endpoints, 8 tool categories, 304 pytest + 514 browser tests, web + Android + offline-only APK from one frontend"
recent_changes: "v3.28.0 — an image can now be turned into text. The OCR engine has existed since v3.26.0, but the only path that reached it was \u300ca scanned PDF\u300d \u2014\u2014 holding a photo of an invoice and wanting the total out of it meant wrapping it into a PDF first and running a conversion, which is absurd. New `StudioReader` panel, reached from \u300c\ud83d\udd24 \u8f49\u6587\u5b57\u300d on the per-image toolbar. **It is the first read-only panel in the studio**, and that shapes it: redaction and annotation hand data back through `patch()` and end in \u300capply\u300d, while this one changes nothing and ends in \u300ccopy\u300d. A pytest guard asserts the branch never calls `patch()`. **The load-bearing decision is which canvas the crop comes from.** The one on screen is the preview thumbnail; a box drawn around one line of an invoice is a few dozen pixels there, and no amount of upscaling brings back what the downscale threw away. The OCR path always crops from `renderItem(item)` with no `usePreview`, and a guard pins that the full-resolution render happens before the crop. **And the upscaling was measured before it was kept**, since the v3.26.0 lesson was that resolution is the variable that matters: new `SMOcrLite.crop()` scales a crop narrower than 1000px up toward it. On a 444px crop of 26px text, upscaled and raw read identically \u2014\u2014 no benefit. On a 275px crop of 11px text, raw reads `03.962.50` and upscaled reads `03,982.50`: a comma became a full stop and an 8 became a 6. That second case is the test, because it is the only one that discriminates. One drag = one region (redaction stacks boxes, but \u300cwhere should I read\u300d has one answer), a tap clears it, and the panel opens by reading the whole image \u2014\u2014 pressing the button *is* the request, so making the user press again would be pointless; the engine load reports its own progress because on the web build that first call fetches 6MB. `digits` is exposed as \u300conly numbers\u300d with the explanation of what it actually does printed under it: it forces every glyph to the nearest allowed character rather than filtering, so it is for a boxed amount, not for tidying up a page. Measured while wiring it: that mode returns `confidence: 0` always, so confidence is shown only in full-charset mode. +19 tests (pytest 301 \u2192 304, the OCR suite 30 \u2192 37, the studio suite 130 \u2192 139 \u2014\u2014 the studio suite drives the real panel against the real wasm bundled in `mobile/www/vendor`, so the whole path is exercised with no stand-in). **Three test-writing traps, all worth recording**: the first version failed because no image was *selected*, and the per-image toolbar only exists then \u2014\u2014 the diagnostic said 1 canvas and the wrong toolbar, not an OCR error at all; clicking the canvas centre then still missed, because 900 lines of earlier tests had changed the layout and gap settings so a single image is not necessarily drawn in the middle (a 3\u00d73 scan finds it, and reports which point worked); and leaving the image selected broke the *next* section, which needs the no-selection toolbar. An existing guard that asserted `useDragBoxes` has exactly two callers went red on the third \u2014\u2014 rewritten to assert what it actually meant, that the definition exists once. Mutation-checked: dropping the upscale turns 2 red, dropping the clamp 1, dropping the white fill 1 (a crop into the transparent corners left by a deskew warp would otherwise reach tesseract as black, not paper). Deliberately left out: a cancel button (a 20-page scan is 15s+, progress is shown but it cannot be stopped) and Chinese, both recorded in docs/TODO.md. Previous change — v3.27.0 — the authentication boundary, which existed but protected less than it looked like it did. Four findings, all from reading the code rather than from a report. **One key was doing two jobs**: `ENCRYPTION_KEY` encrypted stored SMTP passwords *and* signed the identity tokens `create_access_token` hands out \u2014\u2014 two jobs with entirely different threat models, sharing one `sha256(secret)`. Token keys are now derived through a labelled hash (domain separation), so the two differ in bytes and neither reveals the other, and `AUTH_SECRET_KEY` can be rotated alone to log everyone out without touching SMTP. **And the public default key is now fatal, not a warning**: that string sits in `app/config.py`, so `ENABLE_AUTH=True` on top of it means anyone who has read the repository can sign a token for any `user_id`. The service refuses to start on that combination \u2014\u2014 a warning gets lost in the log, and believing you are protected is worse than knowing you are not. **`/api/auth/*` had no rate limiting at all** while the eight functional routers each carried `Depends(rate_limit)`, so passwords could be guessed without limit. The subtle part is that reusing `rate_limit` would have fixed nothing: it keys on the `X-User-Id` header, which the client fills in \u2014\u2014 fine as a quota label for someone already logged in, useless against guessing, since a fresh header buys a fresh quota. Login and register get a separate limiter keyed on `request.client.host` and nothing else (10 per 5 minutes), and a test walks the attack: it varies `X-User-Id` on every attempt and requires a 429 anyway. **Registration was wide open** \u2014\u2014 authentication kept strangers out of the tools while leaving \u300cjust register your own account\u300d wide. It is now the first account only, or a matching `REGISTRATION_TOKEN`; startup says out loud while that first-account window is still open, since the honest cost of zero-config is that whoever registers first owns the deploy. Three smaller things in the same surface: the login cookie's `Secure` flag was hardcoded `False` under a comment suggesting someone change it in production, and now follows the request scheme with `COOKIE_SECURE` to override; \u300cno such user\u300d returned in ~6ms against ~68ms for a wrong password (100k PBKDF2 rounds), which enumerates usernames by stopwatch, so the miss path now computes a dummy hash; and `/health` reported a hardcoded `3.15.0` beside the app's real version in the same file. +12 pytest (289 \u2192 301). **Mutation testing caught three tests that did not actually test their fix**, all the same mistake \u2014\u2014 asserting against a helper instead of the path that uses it: comparing `_get_key() != _auth_key()` proves the module *can* derive two keys, not that `create_access_token` picks the right one (now it signs a real token and requires the SMTP key to fail on it); calling `_cookie_secure()` directly misses the call site being reverted (now it reads a real `Set-Cookie`); and the timing assertion had the wrong bound \u2014\u2014 dropping the dummy hash makes the miss path *faster*, so an upper bound could never fail. All seven mutations are caught now. Deliberately deferred: the roadmap's on-device OCR M2 (Chinese) is now roadmap[0] but was pushed behind this \u2014\u2014 M2 is a large, uncertain increment (a 10MB-class language pack, no network on the offline build, unmeasured accuracy against the backend PaddleOCR), while these were an evening's work on the kind of gap that only shows up the day something is exposed. Also left out and recorded in docs/TODO.md: token revocation (logout clears the cookie but the token stays valid to expiry), per-account guess counting for attackers spread across IPs, and the frozen `?v=3.15.0` cache-busting strings in index.html. Previous change — v3.26.0 — on-device OCR (M1): the scanned-PDF hole is closed for English and digits. `doc-local.js` used to throw \u300c\u9019\u4efd PDF \u62bd\u4e0d\u5230\u6587\u5b57 \u2014\u2014 \u9700\u8981 OCR\u300d, a hole the code admitted to itself: the page has words on it, they are just pixels. New engine `static/js/ocr-lite.js` wraps tesseract.js (LSTM, WebAssembly), entirely on-device \u2014\u2014 the App bundles worker + wasm core + English model into `vendor/` (+6.1MB), the web build points at a CDN, and which is which is one object, `window.SM_OCR_PATHS`, exactly as pdf.js has always worked. **The elegant part is that no new paragraph logic was written**: `fromPdf` already reconstructs headings, paragraphs and lists from \u300ca pile of positioned lines\u300d, and OCR produces exactly that \u2014\u2014 converted to PDF points with the origin flipped bottom-left, downstream cannot tell an extracted page from a recognised one. **The decision is made per page, not per document**: a PDF is routinely a digital cover with scanned attachments behind it, and judging the whole file would leave those attachments as unreadable as before. A test merges one digital page with one scanned page and asserts `ocred` is `[2]`. **Two things had to be learned the hard way.** tesseract.js runs its worker from a `blob:` URL by default, which empties emscripten's `scriptDirectory`, so the core cannot resolve the relative path to its own `.wasm` \u2014\u2014 `workerBlobURL: false` fixes it and keeps the split core (2.87MB + 0.12MB) instead of the single-file base64 build (3.86MB). A second \u300cgotcha\u300d turned out not to be one, and mutation testing is what settled it: a layer was added resolving every asset path against `document.baseURI`, reasoning that a relative `langPath` inside a worker resolves against the *worker* rather than the page and so `vendor` would become `vendor/vendor`. Deleting that layer left all 29 tests green \u2014\u2014 tesseract.js already resolves `corePath`/`workerPath`/`langPath` against `window.location.href` itself \u2014\u2014 so the layer is gone and the wrong inference is written down where it was. The test it motivated stayed: the harness is served from a subdirectory, so if that library behaviour ever changes it surfaces here rather than on a phone. **The whitelist mode is not a filter**: measured, `tessedit_char_whitelist` turns `INVOICE NO. AB-20260901` into `0.-20260901` \u2014\u2014 tesseract forces every glyph to the nearest allowed character rather than dropping it, so `digits` is opt-in for \u300cjust read me this amount\u300d and never the default. **The render width was measured rather than assumed, and the first guess was wrong.** At scale 1 an A4 page is 595px wide and 10pt body text has a 7px cap height; the initial 2000px was picked from that arithmetic. Measuring five widths on a synthetic 10pt scan showed the plateau is at **1000px** (confidence 95, exact text), that 595px costs real accuracy (confidence 84, and it invents a full stop that is not in the source), and that 2000px buys nothing over 1000px while taking twice as long (625ms vs 298ms). The constant is now 1600 \u2014\u2014 headroom over the measured plateau because a synthetic page has no noise, no skew and no JPEG artefacts, which is exactly what resolution buys back on a real scan. That it is headroom and not a measurement is written down, with the numbers and the procedure for revisiting it on real photographs. One worker is shared across pages and `ready()` is re-entrant \u2014\u2014 initialisation is ~0.5s of wasm compile plus a 2.9MB model, so one worker per page would spend fifteen seconds of a twenty-page document doing the same thing over again; a test counts wasm fetches and asserts exactly one. The doc panel names **which** pages were recognised, because \u300cthis document used OCR\u300d asks the user to re-read all of it. +38 tests: a new `npm run test:ocr` suite (30) running real wasm against scanned PDFs built on the spot (canvas \u2192 JPEG \u2192 `imagesToPdf`, so they genuinely have no text layer), plus 8 pytest wiring guards. An existing guard caught a real omission unprompted \u2014\u2014 `sw.js` was missing the new script. **Mutation testing did real work on this one**, beyond confirming the obvious: removing `workerBlobURL: false` hangs the whole suite, dropping the per-page condition turns 2 red, and rolling the render width back to scale 1 turns 3 red \u2014\u2014 but it also found four decisions that nothing was checking. One was deleted as genuinely redundant (the path resolution above); the other three earned the assertions they were missing: line *order* (without the bottom-left flip the page comes out upside-down with every word still present, which no content assertion notices), heading level across a mixed document (the bbox-height-to-font-size ratio only matters where OCR and extracted pages are compared to one common body size), and a pure-noise fixture for the confidence floor. Deliberately left out: Chinese (M2), and an \u300cimage \u2192 text\u300d entry point in the image tools \u2014\u2014 `SMOcrLite.recognize` already takes any canvas, what is missing is only UI. Both are recorded in docs/TODO.md. Previous change — v3.25.0 — annotation tool (M2): a highlighter and freehand pen, so a line can be marked rather than boxed. A box around a line of text says 「this region」; running a highlighter along it says 「this is the point」, and until now the toolbox had no way to say the second thing. **What separates a highlighter from 「a translucent coloured bar」 is the compositing mode**: alpha-blending a colour over black text washes the text grey, while `multiply` only tints the bright pixels, so the text stays black and the whole point — you can still read what you marked — survives. That also means it wants no halo: the dark outline exists so a thin stroke does not vanish on a same-coloured background, and a black frame around a highlighter band just makes it a strange block of colour. It is drawn **butt-capped**, because a real highlighter is flat and a round cap would overshoot each end of the drag by half the band width, onto the next word — marking something the user did not mark. **Highlights always draw underneath every other annotation**, whatever their position in the array: they are a ground colour, and a yellow band laid over a red arrow turns the arrow orange, which is not a thing the user drew. **A drag within 8° of horizontal or vertical is levelled** — the hand always tilts a few degrees crossing a line of text, and a tilted band clips half a character-height between the start and end of the line; past 8° it is taken as 「actually meant to be diagonal」 and drawn as dragged. Freehand stores the **whole trace** (`points`), not two endpoints — a handwritten line is not something two endpoints describe — and renders it as midpoint quadratics, because a raw polyline shows visible corners on a phone. `sign-lite.js` walks strokes the same way, but it feeds two backends (canvas and PDF) so it abstracts into events; duplicating six lines beat making the image engine depend on the signature engine, where a missing dependency degrades silently — right for a stored signature, wrong for the stroke the user just drew. **Thinning happens at capture time** (points closer than 0.4% of the canvas are dropped, 400 per stroke): `pointermove` fires dozens of times a second and every point kept is a point redrawn on every preview. The gesture is still the shared `useDragBoxes` — it gained a `trace` mode, and tap-to-remove is unchanged — and hit-testing a freehand mark uses the bounding box of its points rather than the path, because a thin line is nearly impossible to tap. **Ink is remembered in two sets**: the highlighter has its own row of light colours, since a dark colour multiplied down blacks out the text and a highlighter yellow makes an arrow invisible. The in-progress shape moved from a DOM box to an SVG overlay — freehand has no box to draw, and the arrow had been standing in with a dashed diagonal; the highlighter draft applies the same levelling rule, so the angle you drag is the angle you get. +24 tests: 13 engine, 9 UI, 2 pytest wiring guards. Mutation-checked: reverting `multiply` to normal alpha turns 1 red, dropping the highlight-first ordering 1, butt→round caps 2, removing the levelling 1, quadratics→polyline 1, removing the freehand halo 1, disabling `trace` 2, collapsing the two ink sets into one 1. Deliberately left out: width sliders for the band and the stroke, and making annotations follow rotation — redaction has had that same gap since v3.12.0 and the two belong in one change. Both are recorded in docs/TODO.md. Previous change — v3.24.0 — annotation tool (M1b): text is now a stack of layers instead of one string. A photo often needs more than one caption — a title, a date, a tiled watermark — and each wants its own size, colour and corner; until now adding the second meant deleting the first. **The engine was never the constraint**: `drawTexts()` has taken an array since its first version, and `studio.jsx` was wrapping the single object as `[text]`. So this increment touches no engine code at all — `text` (one state object) became `texts` (an array) plus an `activeText` index, and the dozen sliders in the panel all write back through `patchText()` to the selected layer. A pytest guard asserts `setText({` no longer appears anywhere in the source: miss one slider in the rewrite and it would silently overwrite the whole stack, which is exactly the kind of bug that survives a manual click-through. The panel gained a row of layer chips labelled with the start of each layer's own text, falling back to 「文字 N」 only while it is still empty — six identical 「文字 N」 chips would be no label at all. **There is always one layer left**: deleting the last one clears it rather than removing it, because a panel with nothing to edit reads as a broken feature. The cap is 6 layers, set by how many chips fit across a 390px phone rather than by anything in the engine. **A visible bug fell out of the refactor**: `rotate` is a watermark-only setting — the slider only appears when tiling is on — but its default of -30 rode along on the text object into the engine, so ordinary text has been drawn tilted 30° all along. Non-tiled layers now carry `rotate: 0` explicitly. That is measured, not deduced: with the fix reverted, the rendered string's left and right ends sit 27% of the canvas height apart. +12 tests: 11 UI (studio 103 → 114) and 1 pytest wiring guard. The UI tests measure the *output*, not the state — they diff the composed canvas against a no-text baseline in three horizontal bands, so 「three captions appear at once」, 「changing a slider moves only the selected one」 and 「deleting the middle layer leaves the other two where they were」 are each answered by pixels. Mutation-checked: rendering only the active layer turns 3 red, making `patchText` write to every layer turns 5 red, dropping `rotate: 0` turns 2 red. Deliberately left out: a rotation slider for ordinary text and layer reordering — both would be guesses about what the user wants, and both are recorded in docs/TODO.md. Previous change — v3.23.0 — annotation tool (M1): arrows and boxes, so the picture can carry the instruction. Documents get shared with a note attached — “this section needs changing”, “fill in this column” — and until now that note had to live outside the image. New `drawAnnotations()` in `static/js/image-local.js`. **The shape is stored as the drag itself — start point to end point (`x1,y1,x2,y2`) — not as the `x/y/w/h` rectangle redaction uses.** A box is the same block whichever corner you start from, but an arrow is directed, and normalising to a rectangle throws away the one thing that matters about it: which way it points. The box derives its rectangle from the two points, which is far cheaper than the reverse. A paired test makes the asymmetry explicit — run the same drag backwards and the arrowhead swaps ends while the box comes out pixel-identical. **The stroke carries a dark halo**, for the same reason the text layer has an outline: a red arrow over a red chop is invisible. Unlike the text outline it is not exposed as a setting — the point of an annotation is being seen, not being pretty. **Order is crop → redact → annotate.** An arrow pointing at “change this” is wasted if the mosaic paints over it, so a pytest guard compares where the two calls sit in the source and swapping them goes red. The refactor that made the UI cheap: the drag gesture is now a shared `useDragBoxes` hook and redaction and annotation genuinely run the same code. **What is shared is the gesture — where the user dragged from and to — not the appearance**; how the shape is stored and drawn stays with each caller. Two copies would have drifted, and the user would have met it as “the mosaic can be tapped away but the arrow cannot”. Arrowhead size follows stroke width but is capped at half the shaft, because a short arrow that is all head has no direction left to read. +29 tests: 15 engine (image 71 → 86), 13 UI (studio 90 → 103), 1 pytest wiring guard. Mutation-checked: removing the arrowhead turns 2 red, removing the halo 1, drawing annotations before redaction 1, removing the shared tap-to-remove 1. Deliberately not in this increment — turning `drawTexts`'s single text object into an array, split out as M1b: the engine has taken an array all along, the constraint is purely `studio.jsx` UI work (a layer list plus rewiring a dozen sliders), it has no dependency on arrows and boxes, and bundling the two would not have finished in one night. Also left out: a stroke-width slider (the data structure already accepts `width`, so adding UI now would be guessing what the user wants), and making annotations follow rotation — redaction has had the same gap since v3.12.0 and the two belong in one change. Built from `main` while PR #49 (v3.22.0, auto-shutter) was still open, so this took the *next* roadmap item and used 3.23.0 to avoid colliding on the version number. #49 has since merged and this branch was merged up onto it. Previous change — v3.22.0 — the live viewfinder now presses its own shutter. M1 (v3.20.0) put the box on the document before the shot, but the hand still had to reach for the shutter — and that press is exactly what knocks the framing crooked. `static/js/scan-live.js` now tracks stability and fires on its own: three consecutive detections whose mean corner move is under 1.2% of the frame (about a second at the 350ms detection floor). The measurement deliberately uses the **pre-smoothing** `rawCorners`: smoothed corners converge toward stillness by construction, so scoring them measures the EMA rather than the hand. Three decisions carry the rest. The first detection reports `motion: null`, not 0 — 'no previous frame' and 'did not move' are different claims, and returning 0 would hand out a free steady tick. A low-confidence detection resets the counter unconditionally: an unsure quad drifts anyway, so 'three times in the same place' from one is usually three consecutive misreads of the same wrong thing. And the shot disarms the trigger — one viewfinder session auto-captures once, `stop()` disarms too, and a capture still in flight when the session stops is dropped rather than surfacing a photo into a screen that no longer exists. A failed auto capture reports once and falls back to manual instead of leaving the UI stuck on '拍攝中'. UI: `StudioCamera` gained a countdown ('穩住 2'), a steadiness bar, and a '⏱ 自動' toggle (on by default, remembered in a module-level variable so it does not spring back every time the component unmounts after a shot); pressing the shutter by hand disarms first so no second frame follows. The viewfinder also displays the current corner-motion percentage. For the user that reads as 'your hand is still moving', but it is also the only way the threshold can ever be measured on real hardware: 1.2% / 3 hits are **estimates, not measurements**, because a synthetic stream does not shake at all — its motion is identically zero, so no honest number can be tuned on it. The readout, the reasoning and the procedure are recorded in the engine comments and in docs/TODO.md. +31 tests (live 32 → 56, studio 90 → 97). The moving-scene control drives the paper from the detection callback rather than a `setInterval`: detection is synchronous and eats the UI thread whole, so timers do not run during it and a time-driven fixture only moved a few pixels between detections — the first version of that test passed while auto-capture was firing. Every auto-shutter wait polls for the event instead of sleeping a fixed span, so a loaded CI box does not turn the suite red. Mutation-checked: dropping the low-confidence reset or the post-stop guard turns the matching tests red. Previous change — v3.21.0 — the App's server address now lives in native storage. This is the other half of v3.17.0: the backend address sat in `localStorage`, which in a WebView is cache, not storage. One Clear Cache and the App forgot which machine to talk to and threw the setup screen back at the user, asking them to retype an IP nobody remembers. The obstacle was load order, not storage: `static/js/config.js` is loaded *before* `native.js` and reads the address synchronously, so Capacitor Preferences — which is async — cannot be consulted at that moment. Rather than restructure the load chain, config.js is now split in two. Boot stays synchronous and reads `localStorage`, which on the App is a mirror of native storage and matches it almost always, so `apiBase` still has a value the instant the file loads and nothing downstream changes. `ready()` then reconciles against `SMNative.store` asynchronously: if the mirror was wiped it recovers the address from Preferences and writes the mirror back; if Preferences has no such key it migrates the old address across (once, on upgrade) — the same 'absence is the migration signal' contract the signature library established. The ordering is the actual fix: `native.js` `await`s `SM_CONFIG.ready()` *before* deciding whether to show the server setup overlay. Without that await the address still comes back, but the overlay has already covered the screen, so the user sees no improvement — a pytest guard pins `ready()` ahead of `openServerSetup()` in source order. Because the address can now settle *after* load, `api.js` may no longer treat it as a constant: it subscribes via `onApiBaseChange` and `rebase()`. The `${BASE}` inside each function was always evaluated per call, but seven tool prefixes (`imgBase` and friends) were strings built at load time — miss one and that whole tool category would fire at `https://localhost` on any device that had cleared its cache, so a second pytest guard asserts every declared `xxxBase` reappears inside `rebase()`. `save()` / `clear()` became async so the page reload waits for the Preferences write to land, falling back to `localStorage` if the plugin throws — less durable, but the user's setting is not silently lost. Behaviour on the web build and the offline-only build is untouched: neither has a 'which machine' question, `ready()` resolves immediately, and tests pin that both never touch native storage at all. +25 browser tests in a new suite (`npm run test:config`). Every scenario performs a real page load, with a prelude that stages the flags, `localStorage` and a fake `window.SMCap` before config.js runs, so the load order under test is the App's actual load order — the one thing most likely to be got wrong. Mutation-checked: removing the `await` or the api.js subscription turns four of them red. This increment was built as 3.19.0 while PR #48 (the live viewfinder) was open; #48 merged first and took 3.20.0, so on merging up this became 3.21.0 — the version number follows the order things actually land, which leaves 3.19.0 as a version that never existed. Previous change — v3.20.0 — live viewfinder (M1): the box now follows the document *before* the shutter. Scanning used to run shoot → open the editor → tap deskew → only then find out the shot was crooked; detection itself has existed since v3.14.0 (100–300ms per frame) and what was missing was the camera layer. New device-side engine `static/js/scan-live.js`. Three decisions carry it. **Throttling** is the core, not an optimisation: `SMScanLite.detect()` is synchronous and blocks the UI thread, so the loop never runs per-frame — one detection finishes before the next is scheduled, with a 350ms floor between them, and the frame is sampled down to 640px first. **Smoothing** uses an EMA to settle hand-shake, but snaps straight to the new quad once the mean corner move exceeds 10% of the frame: smoothing costs latency, and when the camera really has moved, latency looks worse than jitter. **The shutter re-detects** the full-resolution frame it keeps — the viewfinder result belongs to the *previous* frame, and handheld those two are never identical; 100–300ms buys \"the box you see in the deskew screen is the box of this photo\". Camera failures map to messages that say what to do next (denied permission is never retried — that was the user’s decision); no rear camera falls back to any camera; `stop()` always ends the tracks, because a leaked track leaves the camera light on. UI: `StudioCamera` in `studio.jsx` — green box when confident, amber plus the v3.18.0 hints when not. Two entry points: the empty screen’s 「📷 用相機拍一張」 (with no images yet, that *is* the starting point — the empty screen has no toolbar) and 「📷 拍照」 on the toolbar. The captured photo carries `liveCorners` into the editor and `StudioDeskew` starts from it instead of re-running an identical detection; `deskewItem` clears the field (after a warp it points at the old image) and `undoDeskew` restores it. +43 tests: a new `npm run test:live` suite (32) that fakes a camera with `canvas.captureStream()` and walks the whole path, 9 UI tests (the \"deskew reuses the viewfinder box\" one proves it by swapping `detect` for a stub that returns a deliberately wrong quad), and 2 engine tests. Auto-shutter is deliberately not in this increment — the stability threshold has to come from real handheld data, and a synthetic stream never shakes. Built while PR #47 (v3.19.0) was still open, so this took the *next* roadmap item and used 3.20.0 to avoid colliding on the version number. Previous change — a low-confidence detection now says *why*. The deskew panel used to answer with one unactionable line (「沒把握抳對」), which leaves the user to re-shoot the identical photo. `static/js/scan-lite.js` gained `assess()`: photos fail in a small number of fixed ways, and every judgement it needs was already computed during detection (brightness integral image, gradient map, quad area). It turns those numbers into a next action — `cropped` (2+ corners pinned to the frame edge), `dark` (paper mean < 85), `glare` (>3% clipped pixels on the paper), `far` (quad < 28% of frame), `flat` (paper-vs-desk brightness gap < 22) — sorted by severity, capped at 3, with a generic `unknown` fallback so a low-confidence result is never silent. `detect()` always returns `hints` and `quality`; `hints` is an empty array on a confident detection, so callers need no special-casing. Every threshold was measured against synthetic bad shots rather than guessed, and a dim-but-legible photo (paper mean 100) sits clear of the `dark` cutoff at 85. A `blur` hint was deliberately dropped after measurement: a sharp blank page and a badly out-of-focus one both score p95 gradient 68, because `features()` already blurs at radius 2 — a false 「照片有點糊」 costs more than the missing hint, and the follow-up is recorded in docs/TODO.md. `studio.jsx` lists the hints under the warning line, only when confidence is low. +13 browser tests (scan 22 → 34, studio 80 → 81), each scenario varying one factor so the hint it produces must match that factor, plus a guard that a well-shot photo gets no advice at all. This increment was built while PR #45 (v3.17.0) was still open, so it took the *next* roadmap item and used 3.18.0 to avoid colliding on the version number; #45 has since merged and this branch was merged up onto it. Previous change — v3.17.0 — the signature library now lives in native storage on the App. It was in `localStorage`, which in a WebView is not storage but *cache*: Android's Clear Cache, the system reclaiming space, and some vendor ROMs' battery cleanups all take it, so a hand-drawn signature could vanish with no warning. `static/js/native.js` gained `SMNative.store` — one interface for 'small things that must survive', backed by Capacitor Preferences (native SharedPreferences, only removed on uninstall) on the App and `localStorage` in the browser. `@capacitor/preferences` had been a dependency all along, just never wired up. The deliberate part: on the App `get()` asks Preferences *only* and does not quietly fall back to `localStorage` — 'the native store has no such key' is precisely the signal for 'migrate the old data across', so falling back would mean the migration never happens and the data stays where it gets wiped. Only a thrown plugin error falls back, so a broken plugin never bricks the feature. Preferences is async while `sign-lite.js`'s `list()` serves the synchronous drawing path, so the App keeps an in-memory copy: `ready()` loads Preferences at startup, `list()` reads that copy, writes queue up and `flush()` awaits them. On upgrade, the first run moves any `localStorage` signatures into Preferences (once). The App also no longer drops the oldest signature when `localStorage` is full — Preferences holds far more, and `localStorage` is only a best-effort mirror there. In the browser the copy stays `null` forever, so `list()` reads `localStorage` every time and two tabs still see each other's signatures — behaviour identical to before. `studio.jsx`'s `useSignatures` awaits `ready()` so the panel no longer flashes '還沒有簽名' before the library appears. +7 browser tests (signature 45 → 52) using a fake `window.SMCap`: migration, 'signatures survive a localStorage wipe', save/delete reaching Preferences, the broken-plugin fallback, and the desktop-browser path never touching native storage. Previous change — v3.16.0 framing now follows rotate/flip/deskew. `static/js/image-local.js` gained `rotateFit` / `flipFit`: the collage focal point is stored in *source* image coordinates, so rotating an item used to leave it pointing at different content and the carefully-adjusted composition jumped the moment you tapped rotate. Crop had this covered since v3.10.0 (`rotateRect` / `flipRect`); framing was the one that got missed. The mapping is deliberately identical to `rotateRect` (clockwise 90° = `(x, y) → (1 - y, x)`) and a test pins that agreement by rotating a zero-size crop rect and comparing — if the two ever diverge, crop and framing would land in different places after a rotate. `zoom` is relative to fill so it carries over untouched; a `null` fit stays `null` (untouched items keep the pixel-identical fast path). `deskewItem` / `undoDeskew` now reset `fit` alongside `cropRect` — a perspective warp remaps the whole image, so the old focal point is meaningless. `studio.jsx` rotate/flip wired up. +15 browser tests (image engine 54 → 69) including a three-band pixel check that samples the same colour before and after a rotate, plus a deliberate 'what it looked like unfixed' case so a regression goes red. Previous change — docs-only planning pass: added a `roadmap` array to this file — 10 items, ordered ROI÷risk, one-line summaries — so the nightly routine can pick roadmap[0] directly instead of re-deriving priority from TODO.md every run. next_milestone now points at roadmap[0]. docs/TODO.md 後續工作 split the three bigger items (live viewfinder, annotation tool, on-device OCR) into explicit M1/M2 checkboxes matching the roadmap entries. docs/DAILY_ROUTINE.md's selection step (定位/選題) and closing contract (收尾契約) updated to read/maintain roadmap. Previous change — docs-only audit: cross-checked README.md/ARCHITECTURE.md/TODO.md against the actual codebase and fixed stale counts — routers 7→9, services 10→12, SQLite tables 7→9, data models 5→8. Before that — GitHub Release step for one-tap APK install: tagging android-v* now makes .github/workflows/android.yml create a GitHub Release with two ready-to-install .apk assets via the runner's built-in gh CLI."

