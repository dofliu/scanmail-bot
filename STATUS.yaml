very run. next_milestone now points at roadmap[0]. docs/TODO.md 後續工作 split the three bigger items (live viewfinder, annotation tool, on-device OCR) into explicit M1/M2 checkboxes matching the roadmap entries. docs/DAILY_ROUTINE.md's selection step (定位/選題) and closing contract (收尾契約) updated to read/maintain roadmap. Previous change — docs-only audit: cross-checked README.md/ARCHITECTURE.md/TODO.md against the actual codebase and fixed stale counts — routers 7→9, services 10→12, SQLite tables 7→9, data models 5→8. Before that — GitHub Release step for one-tap APK install: tagging android-v* now makes .github/workflows/android.yml create a GitHub Release with two ready-to-install .apk assets via the runner's built-in gh CLI."

