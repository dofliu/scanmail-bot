roadmap:
  - "取景跟著旋轉走（rotateFit）：拉正 / 旋轉後對焦點要跟著轉，比照裁切框已有的 rotateRect"
  - "簽名庫改用 Capacitor Preferences：@capacitor/preferences 已是相依套件只是還沒接上；記得網頁版要有等效 fallback"
  - "低信心時的重拍建議：偵測時算過的門檻（反光/過暗/太遠）變成前端提示文案，而不是只說『沒把握』"
  - "即時取景 M1：getUserMedia 取流 + 每隔幾幀跑一次 scan-lite 偵測 + 疊框顯示（先不做自動快門）"
  - "即時取景 M2：框穩定度判斷 + 倒數 + 自動快門（接續 M1）"
  - "標註工具 M1：箭頭 / 方框，共用打碼既有的拖框互動；drawTexts 從單一物件改陣列（多圖層前置工作）"
  - "標註工具 M2：螢光筆 / 手寫（接續 M1 的多圖層）"
  - "裝置端 OCR M1：先做數字與英文（tesseract.js 模型小很多，發票金額/單號/日期先吃下）"
  - "裝置端 OCR M2：中文選配（語言包大、辨識率不如後端 PaddleOCR）"
  - "次像素角點精修：先擱置，等有真實照片的角點誤差回饋再排（現在補是憑空優化）"
