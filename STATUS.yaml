key_metrics: "91 API endpoints, 8 tool categories, 277 pytest + 333 browser tests, web + Android + offline-only APK from one frontend"
recent_changes: "v3.19.0 — the App's server address now lives in native storage. This is the other half of v3.17.0: the backend address sat in `localStorage`, which in a WebView is cache, not storage. One Clear Cache and the App forgot which machine to talk to and threw the setup screen back at the user, asking them to retype an IP nobody remembers. The obstacle was load order, not storage: `static/js/config.js` is loaded *before* `native.js` and reads the address synchronously, so Capacitor Preferences — which is async — cannot be consulted at that moment. Rather than restructure the load chain, config.js is now split in two. Boot stays synchronous and reads `localStorage`, which on the App is a mirror of native storage and matches it almost always, so `apiBase` still has a value the instant the file loads and nothing downstream changes. `ready()` then reconciles against `SMNative.store` asynchronously: if the mirror was wiped it recovers the address from Preferences and writes the mirror back; if Preferences has no such key it migrates the old address across (once, on upgrade) — the same 'absence is the migration signal' contract the signature library established. The ordering is the actual fix: `native.js` `await`s `SM_CONFIG.ready()` *before* deciding whether to show the server setup overlay. Without that await the address still comes back, but the overlay has already covered the screen, so the user sees no improvement — a pytest guard pins `ready()` ahead of `openServerSetup()` in source order. Because the address can now settle *after* load, `api.js` may no longer treat it as a constant: it subscribes via `onApiBaseChange` and `rebase()`. The `${BASE}` inside each function was always evaluated per call, but seven tool prefixes (`imgBase` and friends) were strings built at load time — miss one and that whole tool category would fire at `https://localhost` on any device that had cleared its cache, so a second pytest guard asserts every declared `xxxBase` reappears inside `rebase()`. `save()` / `clear()` became async so the page reload waits for the Preferences write to land, falling back to `localStorage` if the plugin throws — less durable, but the user's setting is not silently lost. Behaviour on the web build and the offline-only build is untouched: neither has a 'which machine' question, `ready()` resolves immediately, and tests pin that both never touch native storage at all. +25 browser tests in a new suite (`npm run test:config`). Every scenario performs a real page load, with a prelude that stages the flags, `localStorage` and a fake `window.SMCap` before config.js runs, so the load order under test is the App's actual load order — the one thing most likely to be got wrong. Mutation-checked: removing the `await` or the api.js subscription turns four of them red. Previous change — v3.18.0 — a low-confidence detection now says *why*. The deskew panel used to answer with one unactionable line (\u300c\u6c92\u628a\u63e1\u62b3\u5c0d\u300d), which leaves the user to re-shoot the identical photo. `static/js/scan-lite.js` gained `assess()`: photos fail in a small number of fixed ways, and every judgement it needs was already computed during detection (brightness integral image, gradient map, quad area). It turns those numbers into a next action — `cropped` (2+ corners pinned to the frame edge), `dark` (paper mean < 85), `glare` (>3% clipped pixels on the paper), `far` (quad < 28% of frame), `flat` (paper-vs-desk brightness gap < 22) — sorted by severity, capped at 3, with a generic `unknown` fallback so a low-confidence result is never silent. `detect()` always returns `hints` and `quality`; `hints` is an empty array on a confident detection, so callers need no special-casing. Every threshold was measured against synthetic bad shots rather than guessed, and a dim-but-legible photo (paper mean 100) sits clear of the `dark` cutoff at 85. A `blur` hint was deliberately dropped after measurement: a sharp blank page and a badly out-of-focus one both score p95 gradient 68, because `features()` already blurs at radius 2 — a false \u300c\u7167\u7247\u6709\u9ede\u7cca\u300d costs more than the missing hint, and the follow-up is recorded in docs/TODO.md. `studio.jsx` lists the hints under the warning line, only when confidence is low. +13 browser tests (scan 22 \u2192 34, studio 80 \u2192 81), each scenario varying one factor so the hint it produces must match that factor, plus a guard that a well-shot photo gets no advice at all. This increment was built while PR #45 (v3.17.0) was still open, so it took the *next* roadmap item and used 3.18.0 to avoid colliding on the version number; #45 has since merged and this branch was merged up onto it. Previous change — v3.17.0 — the signature library now lives in native storage on the App. It was in `localStorage`, which in a WebView is not storage but *cache*: Android's Clear Cache, the system reclaiming space, and some vendor ROMs' battery cleanups all take it, so a hand-drawn signature could vanish with no warning. `static/js/native.js` gained `SMNative.store` — one interface for 'small things that must survive', backed by Capacitor Preferences (native SharedPreferences, only removed on uninstall) on the App and `localStorage` in the browser. `@capacitor/preferences` had been a dependency all along, just never wired up. The deliberate part: on the App `get()` asks Preferences *only* and does not quietly fall back to `localStorage` — 'the native store has no such key' is precisely the signal for 'migrate the old data across', so falling back would mean the migration never happens and the data stays where it gets wiped. Only a thrown plugin error falls back, so a broken plugin never bricks the feature. Preferences is async while `sign-lite.js`'s `list()` serves the synchronous drawing path, so the App keeps an in-memory copy: `ready()` loads Preferences at startup, `list()` reads that copy, writes queue up and `flush()` awaits them. On upgrade, the first run moves any `localStorage` signatures into Preferences (once). The App also no longer drops the oldest signature when `localStorage` is full — Preferences holds far more, and `localStorage` is only a best-effort mirror there. In the browser the copy stays `null` forever, so `list()` reads `localStorage` every time and two tabs still see each other's signatures — behaviour identical to before. `studio.jsx`'s `useSignatures` awaits `ready()` so the panel no longer flashes '還沒有簽名' before the library appears. +7 browser tests (signature 45 → 52) using a fake `window.SMCap`: migration, 'signatures survive a localStorage wipe', save/delete reaching Preferences, the broken-plugin fallback, and the desktop-browser path never touching native storage. Previous change — v3.16.0 framing now follows rotate/flip/deskew. `static/js/image-local.js` gained `rotateFit` / `flipFit`: the collage focal point is stored in *source* image coordinates, so rotating an item used to leave it pointing at different content and the carefully-adjusted composition jumped the moment you tapped rotate. Crop had this covered since v3.10.0 (`rotateRect` / `flipRect`); framing was the one that got missed. The mapping is deliberately identical to `rotateRect` (clockwise 90° = `(x, y) → (1 - y, x)`) and a test pins that agreement by rotating a zero-size crop rect and comparing — if the two ever diverge, crop and framing would land in different places after a rotate. `zoom` is relative to fill so it carries over untouched; a `null` fit stays `null` (untouched items keep the pixel-identical fast path). `deskewItem` / `undoDeskew` now reset `fit` alongside `cropRect` — a perspective warp remaps the whole image, so the old focal point is meaningless. `studio.jsx` rotate/flip wired up. +15 browser tests (image engine 54 → 69) including a three-band pixel check that samples the same colour before and after a rotate, plus a deliberate 'what it looked like unfixed' case so a regression goes red."
