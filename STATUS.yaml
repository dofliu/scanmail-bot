recent_changes: "v3.15.0 — direct touch control for collages. Select an image and drag to reposition it inside its cell, pinch to zoom, or hit swap and tap another image to trade places. Framing is stored as relative values (zoom factor plus a 0-1 focal point) so what you compose on the thumbnail is what the full-resolution export produces, and the focal point is clamped to the range that actually moves so dragging stops cleanly at the edge instead of accumulating dead travel. Images with untouched framing still take the original draw path, so existing collage output is unchanged"

