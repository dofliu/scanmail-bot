recent_changes: "v3.20.0 — live viewfinder (M1): the box now follows the document *before* the shutter. Scanning used to run shoot \u2192 open the editor \u2192 tap deskew \u2192 only then find out the shot was crooked; detection itself has existed since v3.14.0 (100\u2013300ms per frame) and what was missing was the camera layer. New device-side engine `static/js/scan-live.js`. Three decisions carry it. **Throttling** is the core, not an optimisation: `SMScanLite.detect()` is synchronous and blocks the UI thread, so the loop never runs per-frame \u2014 one detection finishes before the next is scheduled, with a 350ms floor between them, and the frame is sampled down to 640px first. **Smoothing** uses an EMA to settle hand-shake, but snaps straight to the new quad once the mean corner move exceeds 10% of the frame: smoothing costs latency, and when the camera really has moved, latency looks worse than jitter. **The shutter re-detects** the full-resolution frame it keeps \u2014 the viewfinder result belongs to the *previous* frame, and handheld those two are never identical; 100\u2013300ms buys \"the box you see in the deskew screen is the box of this photo\". Camera failures map to messages that say what to do next (denied permission is never retried \u2014 that was the user\u2019s decision); no rear camera falls back to any camera; `stop()` always ends the tracks, because a leaked track leaves the camera light on. UI: `StudioCamera` in `studio.jsx` \u2014 green box when confident, amber plus the v3.18.0 hints when not. Two entry points: the empty screen\u2019s \u300c\ud83d\udcf7 \u7528\u76f8\u6a5f\u62cd\u4e00\u5f35\u300d (with no images yet, that *is* the starting point \u2014 the empty screen has no toolbar) and \u300c\ud83d\udcf7 \u62cd\u7167\u300d on the toolbar. The captured photo carries `liveCorners` into the editor and `StudioDeskew` starts from it instead of re-running an identical detection; `deskewItem` clears the field (after a warp it points at the old image) and `undoDeskew` restores it. +43 tests: a new `npm run test:live` suite (32) that fakes a camera with `canvas.captureStream()` and walks the whole path, 9 UI tests (the \"deskew reuses the viewfinder box\" one proves it by swapping `detect` for a stub that returns a deliberately wrong quad), and 2 engine tests. Auto-shutter is deliberately not in this increment \u2014 the stability threshold has to come from real handheld data, and a synthetic stream never shakes. Built while PR #47 (v3.19.0) was still open, so this took the *next* roadmap item and used 3.20.0 to avoid colliding on the version number. Previous change — a low-confidence detection now says *why*. The deskew panel used to answer with one unactionable line (\u300c\u6c92\u628a\u63e1\u62b3\u5c0d\u300d), which leaves the user to re-shoot the identical photo. `static/js/scan-lite.js` gained `assess()`: photos fail in a small number of fixed ways, and every judgement it needs was already computed during detection (brightness integral image, gradient map, quad area). It turns those numbers into a next action — `cropped` (2+ corners pinned to the frame edge), `dark` (paper mean < 85), `glare` (>3% clipped pixels on the paper), `far` (quad < 28% of frame), `flat` (paper-vs-desk brightness gap < 22) — sorted by severity, capped at 3, with a generic `unknown` fallback so a low-confidence result is never silent. `detect()` always returns `hints` and `quality`; `hints` is an empty array on a confident detection, so callers need no special-casing. Every threshold was measured against synthetic bad shots rather than guessed, and a dim-but-legible photo (paper mean 100) sits clear of the `dark` cutoff at 85. A `blur` hint was deliberately dropped after measurement: a sharp blank page and a badly out-of-focus one both score p95 gradient 68, because `features()` already blurs at radius 2 — a false \u300c\u7167\u7247\u6709\u9ede\u7cca\u300d costs more than the missing hint, and the follow-up is recorded in docs/T