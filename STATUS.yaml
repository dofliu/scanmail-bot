recent_changes: "Daily development routine (docs only, no code change). A scheduled Claude Code session wakes at 03:00 Taipei every day, picks the next small-and-complete item from docs/TODO.md 後續工作, implements it with tests, and opens a draft PR. Because each firing starts from a clean environment with no memory of the last one, the routine's closing contract is what keeps continuity: every run must update STATUS.yaml, the TODO.md changelog, and docs/ROUTINE_LOG.md (date / topic / branch / PR / result / next step). Rules live in docs/DAILY_ROUTINE.md so they are versioned and editable, not buried in the schedule. Previous change — v3.15.0 — direct touch control for collages. Select an image and drag to reposition it inside its cell, pinch to zoom, or hit swap and tap another image to trade places. Framing is stored as relative values (zoom factor plus a 0-1 focal point) so what you compose on the thumbnail is what the full-resolution export produces, and the focal point is clamped to the range that actually moves so dragging stops cleanly at the edge instead of accumulating dead travel. Images with untouched framing still take the original draw path, so existing collage output is unchanged"

