recent_changes: "GitHub Release step for one-tap APK install (CI/workflow only, app version unchanged at 3.15.0). Tagging android-v* now makes .github/workflows/android.yml create a GitHub Release with two ready-to-install .apk assets attached: scanmail-<tag>-full.apk (needs the backend) and scanmail-<tag>-offline.apk (device-only media tools). Uses the runner's built-in gh CLI (release create, or release upload --clobber if the tag's release already exists) rather than pulling in a marketplace action; added permissions: contents: write since the default token is read-only. Also fixed a pre-existing mislabeling bug: the tag-triggered assembleRelease ran right after the offline web-assets sync (done for the test:studio step), so the artifact named scanmail-release-apk actually packaged the offline build. The release stage now reruns build_mobile.py --sync and --offline --sync separately before each assembleRelease so both APKs match their names. Previous change — v3.15.0 — direct touch control for collages: select an image and drag to reposition it inside its cell, pinch to zoom, or hit swap and tap another image to trade places, with framing stored as relative values so thumbnail composition matches full-resolution export."

