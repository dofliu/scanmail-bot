recent_changes: "v3.17.0 — the signature library now lives in native storage on the App. It was in `localStorage`, which in a WebView is not storage but *cache*: Android's Clear Cache, the system reclaiming space, and some vendor ROMs' battery cleanups all take it, so a hand-drawn signature could vanish with no warning. `static/js/native.js` gained `SMNative.store` — one interface for 'small things that must survive', backed by Capacitor Preferences (native SharedPreferences, only removed on uninstall) on the App and `localStorage` in the browser. `@capacitor/preferences` had been a dependency all along, just never wired up. The deliberate part: on the App `get()` asks Preferences *only* and does not quietly fall back to `localStorage` — 'the native store has no such key' is precisely the signal for 'migrate the old data across', so falling back would mean the migration never happens and the data stays where it gets wiped. Only a thrown plugin error falls back, so a broken plugin never bricks the feature. Preferences is async while `sign-lite.js`'s `list()` serves the synchronous drawing path, so the App keeps an in-memory copy: `ready()` loads Preferences at startup, `list()` reads that copy, writes queue up and `flush()` awaits them. On upgrade, the first run moves any `localStorage` signatures into Preferences (once). The App also no longer drops the oldest signature when `localStorage` is full — Preferences holds far more, and `localStorage` is only a best-effort mirror there. In the browser the copy stays `null` forever, so `list()` reads `localStorage` every time and two tabs still see each other's signatures — behaviour identical to before. `studio.jsx`'s `useSignatures` awaits `ready()` so the panel no longer flashes '還沒有簽名' before the library appears. +7 browser tests (signature 45 → 52) using a fake `window.SMCap`: migration, 'signatures survive a localStorage wipe', save/delete reaching Preferences, the broken-plugin fallback, and the desktop-browser path never touching native storage. Previous change — v3.16.0 framing now follows rotate/flip/deskew. `static/js/image-local.js` gained `rotateFit` / `flipFit`: the collage focal point is stored in *source* image coordinates, so rotating an item used to leave it pointing at different content and the carefully-adjusted composition jumped the moment you tapped rotate. Crop had this covered since v3.10.0 (`rotateRect` / `flipRect`); framing was the one that got missed. The mapping is deliberately identical to `rotateRect` (clockwise 90° = `(x, y) → (1 - y, x)`) and a test pins that agreement by rotating a zero-size crop rect and comparing — if the two ever diverge, crop and framing would land in different places after a rotate. `zoom` is relative to fill so it carries over untouched; a `null` fit stays `null` (untouched items keep the pixel-identical fast path). `deskewItem` / `undoDeskew` now reset `fit` alongside `cropRect` — a perspective warp remaps the whole image, so the old focal point is meaningless. `studio.jsx` rotate/flip wired up. +15 browser tests (image engine 54 → 69) including a three-band pixel check that samples the same colour before and after a rotate, plus a deliberate 'what it looked like unfixed' case so a regression goes red. Previous change — docs-only planning pass: added a `roadmap` array to this file — 10 items, ordered ROI÷risk, one-line summaries — so the nightly routine can pick roadmap[0] directly instead of re-deriving priority from TODO.md every run. next_milestone now points at roadmap[0]. docs/TODO.md 後續工作 split the three bigger items (live viewfinder, annotation tool, on-device OCR) into explicit M1/M2 checkboxes matching the roadmap entries. docs/DAILY_ROUTINE.md's selection step (定位/選題) and closing contract (收尾契約) updated to read/maintain roadmap. Previous change — docs-only audit: cross-checked README.md/ARCHITECTURE.md/TODO.md against the actual codebase and fixed stale counts — routers 7→9, services 10→12, SQLite tables 7→9, data models 5→8. Before that — GitHub Release step for one-tap APK install: tagging android-v* now makes .github/workflows/android.yml create a GitHub Release with two ready-to-install .apk assets via the runner's built-in gh CLI."

