recent_changes: "v3.14.0 — on-device document edge detection and perspective correction. The offline app previously only had free-form cropping; the actual scanning half lived in the backend OpenCV pipeline. Ported as gradient-directed Hough line detection (documents have straight edges, and lines are voted on by the whole edge so an occluded corner does not matter) plus the backend v5 scoring verbatim: convexity, per-edge gradient support, weakest-edge multiplicative gating. Correction runs a WebGL fragment shader, with output dimensions from Zhang-He aspect-ratio recovery so a skewed A4 does not come out squashed. Below 0.45 confidence it says so instead of cropping blind; 22 detection tests against synthetic ground-truth shots"

