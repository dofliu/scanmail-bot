key_metrics: "91 API endpoints, 8 tool categories, 281 pytest + 435 browser tests, web + Android + offline-only APK from one frontend"
recent_changes: "v3.23.0 — annotation tool (M1): arrows and boxes, so the picture can carry the instruction. Documents get shared with a note attached — “this section needs changing”, “fill in this column” — and until now that note had to live outside the image. New `drawAnnotations()` in `static/js/image-local.js`. **The shape is stored as the drag itself — start point to end point (`x1,y1,x2,y2`) — not as the `x/y/w/h` rectangle redaction uses.** A box is the same block whichever corner you start from, but an arrow is directed, and normalising to a rectangle throws away the one thing that matters about it: which way it points. The box derives its rectangle from the two points, which is far cheaper than the reverse. A paired test makes the asymmetry explicit — run the same drag backwards and the arrowhead swaps ends while the box comes out pixel-identical. **The stroke carries a dark halo**, for the same reason the text layer has an outline: a red arrow over a red chop is invisible. Unlike the text outline it is not exposed as a setting — the point of an annotation is being seen, not being pretty. **Order is crop → redact → annotate.** An arrow pointing at “change this” is wasted if the mosaic paints over it, so a pytest guard compares where the two calls sit in the source and swapping them goes red. The refactor that made the UI cheap: the drag gesture is now a shared `useDragBoxes` hook and redaction and annotation genuinely run the same code. **What is shared is the gesture — where the user dragged from and to — not the appearance**; how the shape is stored and drawn stays with each caller. Two copies would have drifted, and the user would have met it as “the mosaic can be tapped away but the arrow cannot”. Arrowhead size follows stroke width but is capped at half the shaft, because a short arrow that is all head has no direction left to read. +29 tests: 15 engine (image 71 → 86), 13 UI (studio 90 → 103), 1 pytest wiring guard. Mutation-checked: removing the arrowhead turns 2 red, removing the halo 1, drawing annotations before redaction 1, removing the shared tap-to-remove 1. Deliberately not in this increment — turning `drawTexts`'s single text object into an array, split out as M1b: the engine has taken an array all along, the constraint is purely `studio.jsx` UI work (a layer list plus rewiring a dozen sliders), it has no dependency on arrows and boxes, and bundling the two would not have finished in one night. Also left out: a stroke-width slider (the data structure already accepts `width`, so adding UI now would be guessing what the user wants), and making annotations follow rotation — redaction has had the same gap since v3.12.0 and the two belong in one change. Built from `main` while PR #49 (v3.22.0, auto-shutter) was still open, so this took the *next* roadmap item and used 3.23.0 to avoid colliding on the version number. #49 has since merged and this branch was merged up onto it. Previous change — v3.22.0 — the live viewfinder now presses its own shutter. M1 (v3.20.0) put the box on the document before the shot, but the hand still had to reach for the shutter — and that press is exactly what knocks the framing crooked. `static/js/scan-live.js` now tracks stability and fires on its own: three consecutive detections whose mean corner move is under 1.2% of the frame (about a second at the 350ms detection floor). The measurement deliberately uses the **pre-smoothing** `rawCorners`: smoothed corners converge toward stillness by construction, so scoring them measures the EMA rather than the hand. Three decisions carry the rest. The first detection reports `motion: null`, not 0 — 'no previous frame' and 'did not move' are different claims, and returning 0 would hand out a free steady tick. A low-confidence detection resets the counter unconditionally: an unsure quad drifts anyway, so 'three times in the same place' from one is usually three consecutive misreads of the same wrong thing. And the shot disarms the trigger — one viewfinder session auto-captures once, `stop()` disarms too, and a capture still in flight when the session stops is dropped rather than surfacing a photo into a screen that no longer exists. A failed auto capture reports once and falls back to manual instead of leaving the UI stuck on '拍攝中'. UI: `StudioCamera` gained a countdown ('穩住 2'), a steadiness bar, and a '⏱ 自動' toggle (on by default, remembered in a module-level variable so it does not spring back every time the component unmounts after a shot); pressing the shutter by hand disarms first so no second frame follows. The viewfinder also displays the current corner-motion percentage. For the user that reads as 'your hand is still moving', but it is also the only way the threshold can ever be measured on real hardware: 1.2% / 3 hits are **estimates, not measurements**, because a synthetic stream does not shake at all — its motion is identically zero, so no honest number can be tuned on it. The readout, the reasoning and the procedure are recorded in the engine comments and in docs/TODO.md. +31 tests (live 32 → 56, studio 90 → 97). The moving-scene control drives the paper from the detection callback rather than a `setInterval`: detection is synchronous and eats the UI thread whole, so timers do not run during it and a time-driven fixture only moved a few pixels between detections — the first version of that test passed while auto-capture was firing. Every auto-shutter wait polls for the event instead of sleeping a fixed span, so a loaded CI box does not turn the suite red. Mutation-checked: dropping the low-confidence reset or the post-stop guard turns the matching tests red. Previous change — v3.21.0 — the App's server address now lives in native storage. This is the other half of v3.17.0: the backend address sat in `localStorage`, which in a WebView is cache, not storage. One Clear Cache and the App forgot which machine to talk to and threw the setup screen back at the user, asking them to retype an IP nobody remembers. The obstacle was load order, not storage: `static/js/config.js` is loaded *before* `native.js` and reads the address synchronously, so Capacitor Preferences — which is async — cannot be consulted at that moment. Rather than restructure the load chain, config.js is now split in two. Boot stays synchronous and reads `localStorage`, which on the App is a mirror of native storage and matches it almost always, so `apiBase` still has a value the instant the file loads and nothing downstream changes. `ready()` then reconciles against `SMNative.store` asynchronously: if the mirror was wiped it recovers the address from Preferences and writes the mirror back; if Preferences has no such key it migrates the old address across (once, on upgrade) — the same 'absence is the migration signal' contract the signature library established. The ordering is the actual fix: `native.js` `await`s `SM_CONFIG.ready()` *before* deciding whether to show the server setup overlay. Without that await the address still comes back, but the overlay has already covered the screen, so the user sees no improvement — a pytest guard pins `ready()` ahead of `openServerSetup()` in source order. Because the address can now settle *after* load, `api.js` may no longer treat it as a constant: it subscribes via `onApiBaseChange` and `rebase()`. The `${BASE}` inside each function was always evaluated per call, but seven tool prefixes (`imgBase` and friends) were strings built at load time — miss one and that whole tool category would fire at `https://localhost` on any device that had cleared its cache, so a second pytest guard asserts every declared `xxxBase` reappears inside `rebase()`. `save()` / `clear()` became async so the page reload waits for the Preferences write to land, falling back to `localStorage` if the plugin throws — less durable, but the user's setting is not silently lost. Behaviour on the web build and the offline-only build is untouched: neither has a 'which machine' question, `ready()` resolves immediately, and tests pin that both never touch native storage at all. +25 browser tests in a new suite (`npm run test:config`). Every scenario performs a real page load, with a prelude that stages the flags, `localStorage` and a fake `window.SMCap` before config.js runs, so the load order under test is the App's actual load order — the one thing most likely to be got wrong. Mutation-checked: removing the `await` or the api.js subscription turns four of them red. This increment was built as 3.19.0 while PR #48 (the live viewfinder) was open; #48 merged first and took 3.20.0, so on merging up this became 3.21.0 — the version number follows the order things actually land, which leaves 3.19.0 as a version that never existed. Previous change — v3.20.0 — live viewfinder (M1): the box now follows the document *before* the shutter. Scanning used to run shoot → open the editor → tap deskew → only then find out the shot was crooked; detection itself has existed since v3.14.0 (100–300ms per frame) and what was missing was the camera layer. New device-side engine `static/js/scan-live.js`. Three decisions carry it. **Throttling** is the core, not an optimisation: `SMScanLite.detect()` is synchronous and blocks the UI thread, so the loop never runs per-frame — one detection finishes before the next is scheduled, with a 350ms floor between them, and the frame is sampled down to 640px first. **Smoothing** uses an EMA to settle hand-shake, but snaps straight to the new quad once the mean corner move exceeds 10% of the frame: smoothing costs latency, and when the camera really has moved, latency looks worse than jitter. **The shutter re-detects** the full-resolution frame it keeps — the viewfinder result belongs to the *previous* frame, and handheld those two are never identical; 100–300ms buys \"the box you see in the deskew screen is the box of this photo\". Camera failures map to messages that say what to do next (denied permission is never retried — that was the user’s decision); no rear camera falls back to any camera; `stop()` always ends the tracks, because a leaked track leaves the camera light on. UI: `StudioCamera` in `studio.jsx` — green box when confident, amber plus the v3.18.0 hints when not. Two entry points: the empty screen’s 「📷 用相機拍一張」 (with no images yet, that *is* the starting point — the empty screen has no toolbar) and 「📷 拍照」 on the toolbar. The captured photo carries `liveCorners` into the editor and `StudioDeskew` starts from it instead of re-running an identical detection; `deskewItem` clears the field (after a warp it points at the old image) and `undoDeskew` restores it. +43 tests: a new `npm run test:live` suite (32) that fakes a camera with `canvas.captureStream()` and walks the whole path, 9 UI tests (the \"deskew reuses the viewfinder box\" one proves it by swapping `detect` for a stub that returns a deliberately wrong quad), and 2 engine tests. Auto-shutter is deliberately not in this increment — the stability threshold has to come from real handheld data, and a synthetic stream never shakes. Built while PR #47 (v3.19.0) was still open, so this took the *next* roadmap item and used 3.20.0 to avoid colliding on the version number. Previous change — a low-confidence detection now says *why*. The deskew panel used to answer with one unactionable line (「沒把握抳對」), which leaves the user to re-shoot the identical photo. `static/js/scan-lite.js` gained `assess()`: photos fail in a small number of fixed ways, and every judgement it needs was already computed during detection (brightness integral image, gradient map, quad area). It turns those numbers into a next action — `cropped` (2+ corners pinned to the frame edge), `dark` (paper mean < 85), `glare` (>3% clipped pixels on the paper), `far` (quad < 28% of frame), `flat` (paper-vs-desk brightness gap < 22) — sorted by severity, capped at 3, with a generic `unknown` fallback so a low-confidence result is never silent. `detect()` always returns `hints` and `quality`; `hints` is an empty array on a confident detection, so callers need no special-casing. Every threshold was measured against synthetic bad shots rather than guessed, and a dim-but-legible photo (paper mean 100) sits clear of the `dark` cutoff at 85. A `blur` hint was deliberately dropped after measurement: a sharp blank page and a badly out-of-focus one both score p95 gradient 68, because `features()` already blurs at radius 2 — a false 「照片有點糊」 costs more than the missing hint, and the follow-up is recorded in docs/TODO.md. `studio.jsx` lists the hints under the warning line, only when confidence is low. +13 browser tests (scan 22 → 34, studio 80 → 81), each scenario varying one factor so the hint it produces must match that factor, plus a guard that a well-shot photo gets no advice at all. This increment was built while PR #45 (v3.17.0) was still open, so it took the *next* roadmap item and used 3.18.0 to avoid colliding on the version number; #45 has since merged and this branch was merged up onto it. Previous change — v3.17.0 — the signature library now lives in native storage on the App. It was in `localStorage`, which in a WebView is not storage but *cache*: Android's Clear Cache, the system reclaiming space, and some vendor ROMs' battery cleanups all take it, so a hand-drawn signature could vanish with no warning. `static/js/native.js` gained `SMNative.store` — one interface for 'small things that must survive', backed by Capacitor Preferences (native SharedPreferences, only removed on uninstall) on the App and `localStorage` in the browser. `@capacitor/preferences` had been a dependency all along, just never wired up. The deliberate part: on the App `get()` asks Preferences *only* and does not quietly fall back to `localStorage` — 'the native store has no such key' is precisely the signal for 'migrate the old data across', so falling back would mean the migration never happens and the data stays where it gets wiped. Only a thrown plugin error falls back, so a broken plugin never bricks the feature. Preferences is async while `sign-lite.js`'s `list()` serves the synchronous drawing path, so the App keeps an in-memory copy: `ready()` loads Preferences at startup, `list()` reads that copy, writes queue up and `flush()` awaits them. On upgrade, the first run moves any `localStorage` signatures into Preferences (once). The App also no longer drops the oldest signature when `localStorage` is full — Preferences holds far more, and `localStorage` is only a best-effort mirror there. In the browser the copy stays `null` forever, so `list()` reads `localStorage` every time and two tabs still see each other's signatures — behaviour identical to before. `studio.jsx`'s `useSignatures` awaits `ready()` so the panel no longer flashes '還沒有簽名' before the library appears. +7 browser tests (signature 45 → 52) using a fake `window.SMCap`: migration, 'signatures survive a localStorage wipe', save/delete reaching Preferences, the broken-plugin fallback, and the desktop-browser path never touching native storage. Previous change — v3.16.0 framing now follows rotate/flip/deskew. `static/js/image-local.js` gained `rotateFit` / `flipFit`: the collage focal point is stored in *source* image coordinates, so rotating an item used to leave it pointing at different content and the carefully-adjusted composition jumped the moment you tapped rotate. Crop had this covered since v3.10.0 (`rotateRect` / `flipRect`); framing was the one that got missed. The mapping is deliberately identical to `rotateRect` (clockwise 90° = `(x, y) → (1 - y, x)`) and a test pins that agreement by rotating a zero-size crop rect and comparing — if the two ever diverge, crop and framing would land in different places after a rotate. `zoom` is relative to fill so it carries over untouched; a `null` fit stays `null` (untouched items keep the pixel-identical fast path). `deskewItem` / `undoDeskew` now reset `fit` alongside `cropRect` — a perspective warp remaps the whole image, so the old focal point is meaningless. `studio.jsx` rotate/flip wired up. +15 browser tests (image engine 54 → 69) including a three-band pixel check that samples the same colour before and after a rotate, plus a deliberate 'what it looked like unfixed' case so a regression goes red. Previous change — docs-only planning pass: added a `roadmap` array to this file — 10 items, ordered ROI÷risk, one-line summaries — so the nightly routine can pick roadmap[0] directly instead of re-deriving priority from TODO.md every run. next_milestone now points at roadmap[0]. docs/TODO.md 後續工作 split the three bigger items (live viewfinder, annotation tool, on-device OCR) into explicit M1/M2 checkboxes matching the roadmap entries. docs/DAILY_ROUTINE.md's selection step (定位/選題) and closing contract (收尾契約) updated to read/maintain roadmap. Previous change — docs-only audit: cross-checked README.md/ARCHITECTURE.md/TODO.md against the actual codebase and fixed stale counts — routers 7→9, services 10→12, SQLite tables 7→9, data models 5→8. Before that — GitHub Release step for one-tap APK install: tagging android-v* now makes .github/workflows/android.yml create a GitHub Release with two ready-to-install .apk assets via the runner's built-in gh CLI."

