name: Android App

# 前端只有一份（static/），這個流程負責把它打包成可以裝到手機的 APK。
# 平常 push 會產出 debug APK 當作「這次改動在手機上也能裝起來」的驗證，
# 打 tag（android-v*）時再產出 release APK。
on:
  push:
    branches: ["**"]
    paths:
      - "static/**"
      - "mobile/**"
      - "scripts/build_mobile.py"
      - ".github/workflows/android.yml"
    tags:
      - "android-v*"
  pull_request:
    paths:
      - "static/**"
      - "mobile/**"
      - "scripts/build_mobile.py"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      api_base:
        description: "打包進 App 的後端位址（留空則由使用者在 App 內設定）"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci

      # 本地圖片引擎只能在瀏覽器裡驗（Canvas），pytest 測不到
      - name: Test local image engine
        working-directory: mobile
        run: |
          npx playwright install --with-deps chromium
          npm run test:image

      - name: Build web assets for the app
        env:
          SM_API_BASE: ${{ github.event.inputs.api_base }}
        run: python scripts/build_mobile.py --sync

      - name: Assemble debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: scanmail-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 離線精簡版：只有裝置端的媒體工具，完全不需要後端
      - name: Build offline-only web assets
        run: python scripts/build_mobile.py --offline --sync

      # 介面測試要有 mobile/www 才能跑，所以排在離線建置之後
      - name: Test offline studio UI
        working-directory: mobile
        run: npm run test:studio

      - name: Assemble offline-only APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload offline APK
        uses: actions/upload-artifact@v4
        with:
          name: scanmail-offline-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ── 以下只在打 tag 時執行 ──

      - name: Decode signing keystore
        id: keystore
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "沒有設定 ANDROID_KEYSTORE_BASE64，將產出未簽章的 release APK"
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble release APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: actions/upload-artifact@v4
        with:
          name: scanmail-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
