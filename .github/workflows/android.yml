name: Android App

# 前端只有一份（static/），這個流程負責把它打包成可以裝到手機的 APK。
# 平常 push 會產出 debug APK 當作「這次改動在手機上也能裝起來」的驗證，
# 打 tag（android-v*）時再產出 release APK。
on:
  push:
    branches: ["**"]
    paths:
      - "static/**"
      - "mobile/**"
      - "scripts/build_mobile.py"
      - ".github/workflows/android.yml"
    tags:
      - "android-v*"
  pull_request:
    paths:
      - "static/**"
      - "mobile/**"
      - "scripts/build_mobile.py"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      api_base:
        description: "打包進 App 的後端位址（留空則由使用者在 App 內設定）"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    # 打 tag 時要用 gh release create/upload 附加 APK，預設的 read-only token 做不到
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci

      # 本地圖片引擎只能在瀏覽器裡驗（Canvas），pytest 測不到
      - name: Test local image engine
        working-directory: mobile
        run: |
          npx playwright install --with-deps chromium
          npm run test:image

      # 文件轉檔同理：產出真的 zip / 真的 PDF，再讀回來比對
      - name: Test document conversion engine
        working-directory: mobile
        run: npm run test:doc

      # PDF 頁面操作：合併 / 刪頁 / 重排之後，用 pdf.js 與 qpdf 各驗一次
      - name: Test PDF page operations
        working-directory: mobile
        run: |
          pip install pikepdf
          npm run test:pages

      # 簽名 / 印章：蓋完之後把頁面畫出來數墨點，確認落在該落的位置
      - name: Test signatures and stamps
        working-directory: mobile
        run: npm run test:sign

      # 邊界偵測 / 透視校正：合成有標準答案的「拍紙本」影像，量角點誤差
      - name: Test edge detection and perspective correction
        working-directory: mobile
        run: npm run test:scan

      # 伺服器位址的儲存與救援：載入順序是這件事最容易寫錯的地方，
      # 每個情境都真的載入一次頁面，讓 config.js / native.js / api.js 照真實順序跑
      - name: Test server address storage
        working-directory: mobile
        run: npm run test:config
      # 即時取景：用 canvas.captureStream() 當假相機，整條路（取流 → 偵測 →
      # 疊框 → 快門）都走得完，不需要 runner 上有鏡頭
      - name: Test live viewfinder
        working-directory: mobile
        run: npm run test:live

      - name: Build web assets for the app
        env:
          SM_API_BASE: ${{ github.event.inputs.api_base }}
        run: python scripts/build_mobile.py --sync

      - name: Assemble debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: scanmail-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 離線精簡版：只有裝置端的媒體工具，完全不需要後端
      - name: Build offline-only web assets
        run: python scripts/build_mobile.py --offline --sync

      # 介面測試要有 mobile/www 才能跑，所以排在離線建置之後
      - name: Test offline studio UI
        working-directory: mobile
        run: npm run test:studio

      - name: Assemble offline-only APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload offline APK
        uses: actions/upload-artifact@v4
        with:
          name: scanmail-offline-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ── 以下只在打 tag 時執行 ──

      - name: Decode signing keystore
        id: keystore
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "沒有設定 ANDROID_KEYSTORE_BASE64，將產出未簽章的 release APK"
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      # mobile/www/ 現在裝的是上面「離線精簡版」的內容（測 test:studio 時同步過），
      # 完整版 release 要先切回來重新同步一次，不然簽出來的是掛著完整版名字的離線版
      - name: Rebuild full web assets for release
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: python scripts/build_mobile.py --sync

      - name: Assemble full release APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload full release APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: actions/upload-artifact@v4
        with:
          name: scanmail-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 這一份留給 GitHub Release —— 檔名要在跟離線版一起發佈時分得清楚
      - name: Collect full release APK for the Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          mkdir -p release-assets
          cp mobile/android/app/build/outputs/apk/release/*.apk \
            "release-assets/scanmail-${{ github.ref_name }}-full.apk"

      - name: Rebuild offline web assets for release
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: python scripts/build_mobile.py --offline --sync

      - name: Assemble offline release APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload offline release APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: actions/upload-artifact@v4
        with:
          name: scanmail-offline-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Collect offline release APK for the Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          cp mobile/android/app/build/outputs/apk/release/*.apk \
            "release-assets/scanmail-${{ github.ref_name }}-offline.apk"

      # 免登入、點下去就能裝：把兩個 APK 附到這個 tag 的 GitHub Release 上。
      # 用 gh CLI（runner 內建）而不是另外引入 marketplace action。
      # 允許重跑同一個 tag：release 已存在就改用 upload --clobber 蓋掉舊檔。
      - name: Publish GitHub Release with APKs
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" release-assets/*.apk \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create "${{ github.ref_name }}" release-assets/*.apk \
              --repo "${{ github.repository }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi
